# 全仓库的默认跑法：configs/jobs/ 下所有 job config 的基底。
#
# 这个文件是**输入**，是 configs/ 里唯一需要手改的东西；
# 同级的 jobs/ 整个目录都是 make configs 生成的产物，可以随时删掉重建。
#
# 每道题可以在自己的 task.toml 的 [metadata.opc] 里覆盖。
#
# 为什么默认值放在这里而不是散在每道题里：跑分要可比，
# 同一批题用不同的模型或不同的遍数跑出来的分放在一张表上是没有意义的。
# 覆盖是例外，例外要显眼。

[defaults]
# 每道题跑几遍。方差大的题需要更多遍才能看出是能力还是运气。
attempts = 3

# 用哪些模型跑。provider 前缀必须是适配器支持的三个之一。
models = [
  "deepseek/deepseek-flash",
]

# 两个基础镜像。task.toml 里声明的必须与任务 Dockerfile 的 ARG 默认值一致，
# make lint 会check。
base_image = "opc-benchmark/hermes-base:local"
verifier_image = "opc-benchmark/verifier-base:local"

# 并发 trial 数，生成 job config 时写进去。
n_concurrent_trials = 4
